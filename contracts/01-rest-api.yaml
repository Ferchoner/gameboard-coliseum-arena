          type: string
          minLength: 10
          maxLength: 128
          format: password
        displayName:
          type: string
          minLength: 1
          maxLength: 30
          description: Si falta, se usa el nombre de usuario.
    LoginRequest:
      type: object
      required:
      - username
      - password
