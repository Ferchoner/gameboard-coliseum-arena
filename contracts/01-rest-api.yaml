        displayName:
          type: string
          minLength: 1
          maxLength: 30
          description: El nombre que se muestra. No es único.
        biography:
          type:
          - string
          - 'null'
          maxLength: 280
      minProperties: 1
    CreateRoomRequest:
      type: object
      required:
      - gameSlug
      - mode
      - timeControl
      - maxPlayers
      additionalProperties: false
      properties:
        gameSlug:
          type: string
          description: Nombre corto y estable del juego.
          examples:
          - four-in-a-row
        mode:
          $ref: '#/components/schemas/MatchMode'
        timeControl:
          $ref: '#/components/schemas/TimeControl'
        maxPlayers:
          type: integer
          minimum: 1
