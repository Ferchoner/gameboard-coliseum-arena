# Comprobaciones de cada pull request (ADR-012, decisión S23).
name: Comprobaciones

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# En una pull request, un empuje nuevo cancela la comprobación anterior. En
# `main` no se cancela nada, para que cada commit fusionado tenga su resultado
# completo (análisis del 2026-11-19, T-32).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Formato, análisis, dependencias, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gameboard
          POSTGRES_PASSWORD: gameboard
          POSTGRES_DB: gameboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gameboard -d gameboard_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgres://gameboard:gameboard@localhost:5432/gameboard_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Análisis del código
        run: pnpm lint

      - name: Compilar
        run: pnpm build

      # Un cambio en el esquema sin su migración hace fallar este paso
      # (ADR-002, condición 5.3; análisis del 2026-11-19, T-09). Va después de
      # compilar porque el esquema importa el paquete de contratos compilado.
      - name: Migraciones al día con el esquema
        timeout-minutes: 2
        run: pnpm db:check

      - name: Reglas de dependencias entre paquetes y módulos
        run: pnpm deps:check

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas
        run: pnpm test

  e2e:
    name: Pruebas en navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gameboard
          POSTGRES_PASSWORD: gameboard
          POSTGRES_DB: gameboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gameboard -d gameboard"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # Las pruebas crean esta base de datos de cero en cada ejecución.
      E2E_DATABASE_URL: postgres://gameboard:gameboard@localhost:5432/gameboard_e2e

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar
        run: pnpm build

      # Sin `--with-deps`: la imagen de GitHub ya trae las librerías que pide
      # Chromium, y `apt` llegaba a tardar 6 minutos (análisis del 2026-11-19,
      # T-07). WebKit sí las necesitará.
      - name: Instalar el navegador
        run: pnpm --filter @gameboard/e2e exec playwright install chromium

      - name: Pruebas en navegador
        run: pnpm test:e2e

      # Trazas y capturas de las pruebas que fallan o se reintentan, para
      # depurarlas sin repetirlas (análisis del 2026-11-19, T-08).
      - name: Guardar las trazas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trazas-de-playwright
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
